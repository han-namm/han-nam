<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우우 우우</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        p { color: #aaaaaa; }
        .quote { font-style: italic; margin-top: 20px; color: #888; }
    </style>
</head>
<body>
    <h1>이게뭐야!</h1>
    <p>이게먼데.</p>
    <div class="quote">"이게 뭐야."</div>
</body>
</html>
