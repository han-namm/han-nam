<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기 소개</title>
    <style>
        /* 1. 배경 설정: 진한 파랑에서 남색으로 이어지는 그라데이션 + 별 효과 */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #001a33 100%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 밤하늘 별 애니메이션 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: radial-gradient(white, rgba(255, 255, 255, 0.2) 1px, transparent 20px);
            background-size: 50px 50px;
            animation: starrysky 100s linear infinite;
            opacity: 0.5;
        }

        @keyframes starrysky {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        /* 메인 컨테이너 */
        .container {
            width: 90%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.05); /* 어두운 투명 배경 */
            backdrop-filter: blur(10px); /* 유리알 효과 */
            padding: 40px 20px;
            margin: 40px 0;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        /* 프로필 섹션 */
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 { font-size: 2.2rem; margin: 10px 0; color: #e3f2fd; }
        .handle { color: #90caf9; font-size: 0.9rem; display: block; margin-bottom: 25px; }

        /* 섹션 타이틀 */
        h2 { 
            font-size: 1.2rem; 
            color: #bbdefb; 
            margin-top: 40px; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px;
        }
        h2::before, h2::after { content: "✦"; font-size: 0.8rem; opacity: 0.6; }

        /* 카드 형태의 소개글 */
        .content-card {
            background: rgba(255, 255, 255, 0.07);
            padding: 20px;
            border-radius: 20px;
            line-height: 1.8;
            font-size: 0.95rem;
            color: #e0e0e0;
            margin-bottom: 25px;
            text-align: left;
        }

        /* 태그 스타일 */
        .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .tag {
            background: rgba(144, 202, 249, 0.15);
            border: 1px solid rgba(144, 202, 249, 0.3);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #e3f2fd;
        }

        /* 상태 바 */
        .stat-item { margin-bottom: 15px; }
        .stat-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: #bbdefb; }
        .progress-bg { background: rgba(255, 255, 255, 0.1); height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(to right, #42a5f5, #1e88e5); border-radius: 4px; }

        /* 버튼 */
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-3px); }

    </style>
</head>
<body>
    <div class="stars"></div>

    <div class="container">
        <img src="https://via.placeholder.com/140" alt="프로필" class="profile-img">
        <h1>한남이</h1>
        <span class="handle">@ han_nam</span>
        <p style="color: #cfd8dc; font-style: italic;">"세상이 싫어도 오늘도 살아있어요."</p>

        <div class="tags">
            <div class="tag">♂ 여자?</div>
            <div class="tag">🎂 08년생</div>
            <div class="tag">✨ ENFP</div>
            <div class="tag">🎮 게임러</div>
            <div class="tag">🎧 음악중독</div>
        </div>

        <h2>나에 대해서</h2>
        <div class="content-card">
            ㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇ<br>
            ㅇㅇㅇㅇㅇㅇ.<br>
            ㅇㅇㅇㅇㅇㅇ🌙
        </div>

       
        </div>

        <h2>세글자</h2>
        <div class="content-card" style="font-size: 0.9rem;">
            ㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇ<br>
            ㅇㅇㅇㅇ<br>
            ㅇㅇㅇㅇ
        </div>

        <a href="#" class="btn">Twitter 바로가기</a>
    </div>
</body>
</html>
